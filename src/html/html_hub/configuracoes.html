<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Configurações</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/css/hub_css/configuracoes.css">
</head>

<body class="pagina-perfil">
    <div class="layout">

        <aside class="sidebar">
            <img class="logo" src="/src/img/logo-amplia+.png" alt="Amplia +" />

            <nav>
                <a href="inicio-hub.html"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="conexoes.html"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="minhas-maquinas.html"><i class="bi bi-printer-fill"></i> Minhas máquinas</a>
                <a href="mensagens.html"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>

            <div class="rodape-menu">
                <a href="configuracoes.html"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <main class="conteudo">

            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="perfil.html" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>

            <section class="cabecalho">
                <div>
                    <h1>
                        Configurações
                    </h1>
            </section>

            <section class="area-configuracoes">
                <div class="caixa-configuracoes">
                    <h2>Visual e Contraste</h2>
                    <div class="conteudo-caixa">
                    <!--alto contraste--> 
                    <label class="opcao-contraste">
                        <input type="checkbox" id="alto-contraste">
                        <span class="switch"></span>
                        <span>Ativar Alto Contraste</span>
                    </label>
                    <!--inverter cor-->
                    <label class="opcao-contraste">
                        <input type="checkbox" id="inverter-cores">
                        <span class="switch"></span>
                        <span>Inverter Cores</span>
                    </label>
                    <!--daltonico-->
                    <label class="opcao-contraste">
                        <input type="checkbox" id="modo-daltonico">
                        <span class="switch"></span>
                        <span>Modo Daltônico</span>
                    </label>
                    <!--fonte--> 
                    <div class="grupo-fonte">
                        <p style="margin-top: 5px; font-size: 18px;" >Tamanho Fonte</p>
                        <div class="botoes-fonte">
                            <button style="margin-left: 30px; font-size: 27px;" type="button" aria-label="Aumentar fonte">
                            A⁺
                            </button>
                            <button style="margin-left: 5px; font-size: 23px;" type="button" aria-label="Diminuir fonte">
                            A⁻
                            </button>
                        </div>
                    </div>
                    </div>
                </div>
                <div class="caixa-configuracoes">
                    <h2>Tipografia e Leitura</h2>
                    <div class="conteudo-caixa">
                        <label for="fonte-padrao" class="opcao-fonte" style="margin-bottom: 4px;">
                            <input
                                type="radio"
                                name="tipografia"
                                id="fonte-padrao"
                                value="inter"
                                checked
                            >
                            Fonte padrão (Inter)    
                        </label>
                        <label for="fonte-dislexia" class="opcao-fonte">
                            <input
                                type="radio"
                                name="tipografia"
                                id="fonte-dislexia"
                                value="lexend"
                                checked
                            >
                            Fonte para Dislexia (Lexend)    
                        </label>

                    </div>
                </div>
            </section>

        </main>
    </div>

</body>

</html>
