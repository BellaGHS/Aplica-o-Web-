<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/css/notificacao.css">
</head>
<body>
    <div id="fundo-modal" class="fundo-modal">
        <section class="conteudo-modal" role="dialog" aria-modal="true">
            <div class="container text-center h-50 p-3 w-auto">
                <div class="row aling-items-center">
                    <div class="titulo-notificacoes col">
                        <h2>Notificação</h2>
                    </div>
                        <div class="list-group lista-notificacao">
                            <button
                                type="button"
                                class="list-group-item list-group-item-action item-notificacao ativa">
                                <div class="d-flex align-items-center gap-3">
                                    <!-- Ícone da notificação -->
                                    <div class="icon-notificacao flex-shrink-0">
                                        <img
                                            src="/src/img/conexao-notificacao.png"
                                            alt="Nova conexão"
                                            class=" img-notificacao img-fluid">
                                    </div>
                                    <!-- Informações da notificação -->
                                    <div class="flex-grow-1 text-start">
                                        <div class="nome-notificacao">
                                            Nova conexão
                                        </div>
                                        <div class="ultima-mensagem">
                                            Fab Lab aceitou o seu projeto.
                                        </div>
                                        <div class="hora-mensagem">
                                            há 10 minutos
                                        </div>
                                    </div>
                                    <!-- Seta à direita -->
                                    <i class="bi bi-chevron-right text-secondary"></i>
                                </div>
                            </button>

                            <button
                                type="button"
                                class="list-group-item list-group-item-action item-notificacao ativa">
                                <div class="d-flex align-items-center gap-3">
                                    <!-- Ícone da notificação -->
                                    <div class="icon-notificacao flex-shrink-0">
                                        <img
                                            src="/src/img/projeto-notificacao.png"
                                            alt="Nova conexão"
                                            class=" img-notificacao img-fluid">
                                    </div>
                                    <!-- Informações da notificação -->
                                    <div class="flex-grow-1 text-start">
                                        <div class="nome-notificacao">
                                            Projeto enviado
                                        </div>
                                        <div class="ultima-mensagem">
                                            Seu projeto foi enviado.
                                        </div>
                                        <div class="hora-mensagem">
                                            ontem
                                        </div>
                                    </div>
                                    <!-- Seta à direita -->
                                    <i class="bi bi-chevron-right text-secondary"></i>
                                </div>
                            </button>

                            <button
                                type="button"
                                class="list-group-item list-group-item-action item-notificacao ativa">
                                <div class="d-flex align-items-center gap-3">
                                    <!-- Ícone da notificação -->
                                    <div class="icon-notificacao flex-shrink-0">
                                        <img
                                            src="/src/img/mensagem-notificacao.png"
                                            alt="Nova conexão"
                                            class=" img-notificacao img-fluid">
                                    </div>
                                    <!-- Informações da notificação -->
                                    <div class="flex-grow-1 text-start">
                                        <div class="nome-notificacao">
                                            Nova mensagem
                                        </div>
                                        <div class="ultima-mensagem">
                                            Você recebeu uma mensagem.
                                        </div>
                                        <div class="hora-mensagem">
                                            ontem
                                        </div>
                                    </div>
                                    <!-- Seta à direita -->
                                    <i class="bi bi-chevron-right text-secondary"></i>
                                </div>
                            </button>




                        </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Aqui é o javascript do pop-up, pra linkar tudo e fazer ele abrir qnd clicar -->
    <script>
        const fundo = document.getElementById("fundo-modal");

        document.getElementById("abrir-modal").addEventListener("click", () => {
            fundo.classList.add("aberto");
        });

        document.getElementById("cancelar").addEventListener("click", () => {
            fundo.classList.remove("aberto");
        });

        document.getElementById("confirmar").addEventListener("click", () => {
            // aqui é pra ligar pro botao realmente desativar, no beck-end
            fundo.classList.remove("aberto");
        });
    </script>
</body>
</html>
