<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Perfil do projeto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/src/css/hub_css/inicio-hub.css">
    <link rel="stylesheet" href="/src/css/hub_css/perfil-projeto.css">
</head>

<body class="pagina-perfil">
    <div class="layout">

        <aside class="sidebar">
            <img class="logo" src="/src/img/logo-amplia+.png" alt="Amplia +" />

            <nav>
                <a href="../inicio-hub/"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="conexoes.html"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="../meus-projetos/"><i class="bi bi-clipboard2-fill"></i> Meus projetos</a>
                <a href="mensagens.html"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>

            <div class="rodape-menu">
                <a href="configuracoes.html"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <main class="conteudo">

            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="perfil.html" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>

            <section class="banner-perfil">
                <div class="avatar-grande"><i class="bi bi-person-fill"></i></div>
                <div>
                    <h1></h1>
                    <span class="tipo"></span>
                    <p></p>
                </div>
            </section>

            <!-- informaçoes do projeto -->
            <section class="card-perfil">
                <div class="cabecalho-card">
                    <h2><i class="bi bi-info-circle"></i> Informações do projeto</h2>
                    <a href="editar-projeto.html" class="btn-editar">
                        <i class="bi bi-pencil-fill"></i> <span>Editar projeto</span>
                    </a>
                </div>

                <form class="grade-campos">
                    <div>
                        <label for="nome-projeto">Nome do projeto</label>
                        <input type="text" id="nome-projeto" name="nome-projeto" readonly>
                    </div>
                    <div>
                        <label for="responsavel">Responsável</label>
                        <input type="text" id="responsavel" name="responsavel" readonly>
                    </div>
                    <div>
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" name="categoria" readonly>
                    </div>
                    <div>
                        <label for="status">Status</label>
                        <input type="text" id="status" name="status" readonly>
                    </div>
                    <div>
                        <label for="prazo">Prazo de entrega</label>
                        <input type="text" id="prazo" name="prazo" readonly>
                    </div>
                    <div>
                        <label for="localizacao">Localização</label>
                        <input type="text" id="localizacao" name="localizacao" readonly>
                    </div>
                </form>
            </section>

            <!-- descriçao -->
            <section class="card-perfil">
                <div class="cabecalho-card">
                    <h2><i class="bi bi-journal-text"></i> Sobre o projeto</h2>
                </div>
                <p class="texto-sobre"></p>
            </section>

            <!-- especificaçoes -->
            <section class="card-perfil">
                <div class="cabecalho-card">
                    <h2><i class="bi bi-rulers"></i> Especificações técnicas</h2>
                </div>

                <form class="grade-campos">
                    <div>
                        <label for="material">Material</label>
                        <input type="text" id="material" name="material" readonly>
                    </div>
                    <div>
                        <label for="quantidade">Quantidade</label>
                        <input type="text" id="quantidade" name="quantidade" readonly>
                    </div>
                    <div>
                        <label for="dimensoes">Dimensões</label>
                        <input type="text" id="dimensoes" name="dimensoes" readonly>
                    </div>
                    <div>
                        <label for="arquivo">Arquivo do modelo</label>
                        <input type="text" id="arquivo" name="arquivo" readonly>
                    </div>
                </form>
            </section>

        </main>
    </div>

</body>

</html>
