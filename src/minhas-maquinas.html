<!doctype html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Minhas máquinas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/inicio-hub.css">
    <link rel="stylesheet" href="css/maquinas.css">
</head>
 
<body class="pagina-maquinas">
    <div class="layout">
 
        
        <aside class="sidebar">
            <img class="logo" src="img/logo-amplia+.png" alt="Amplia +" />
 
            <nav>
                <a href="inicio-hub.html"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="conexoes.html"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="minhas-maquinas.html" class="ativo"><i class="bi bi-printer-fill"></i> Minhas máquinas</a>
                <a href="mensagens.html"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>
 
            <div class="rodape-menu">
                <a href="configuracoes.html"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>
 
        <main class="conteudo">
 
            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="perfil.html" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>
 
            <div class="topo-maquinas">
                <h1>Minhas máquinas</h1>
                <a href="adicionar-maquina.html" class="btn-adicionar">Adicionar +</a>
            </div>
 
            <!-- abas de disponibilidade -->
            <input type="radio" name="filtro" id="aba-todos" class="filtro-maquinas" checked>
            <input type="radio" name="filtro" id="aba-disponivel" class="filtro-maquinas">
            <input type="radio" name="filtro" id="aba-indisponivel" class="filtro-maquinas">
 
            <div class="abas">
                <label for="aba-todos">Todos <span>(2)</span></label>
                <label for="aba-disponivel">Disponível <span>(1)</span></label>
                <label for="aba-indisponivel">Indisponível <span>(1)</span></label>
            </div>
 
            <section class="lista-maquinas">
 
                <!-- maquinas disponiveis -->
                <article class="card-maquina disponivel">
                    <div class="foto-maquina"><!-- <img src="img/maquina.png" alt=""> --></div>
 
                    <div class="info-maquina">
                        <h3></h3>
                        <p class="tipo-maquina"></p>
                        <div class="meta">
                            <span><i class="bi bi-geo-alt-fill"></i><span class="local"></span></span>
                            <a href="#"><i class="bi bi-info-square-fill"></i>Informações</a>
                        </div>
                        <span class="selo">Disponível</span>
                    </div>
 
                    <div class="acoes-maquina">
                        <a href="editar-maquina.html">Editar</a>
                        <button type="button">Desativar</button>
                    </div>
                </article>
 
                <!-- maquinas indisponiveis -->
                <article class="card-maquina indisponivel">
                    <div class="foto-maquina"></div>
 
                    <div class="info-maquina">
                        <h3></h3>
                        <p class="tipo-maquina"></p>
                        <div class="meta">
                            <span><i class="bi bi-geo-alt-fill"></i><span class="local"></span></span>
                            <a href="#"><i class="bi bi-info-square-fill"></i>Informações</a>
                        </div>
                        <span class="selo indisponivel">Indisponível</span>
                    </div>
 
                    <div class="acoes-maquina">
                        <a href="editar-maquina.html">Editar</a>
                        <button type="button">Desativar</button>
                    </div>
                </article>
 
            </section>
        </main>
    </div>
</body>
 
</html>
