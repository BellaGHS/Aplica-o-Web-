<!doctype html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Log-in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/login.css">
</head>
 
<body>

    <header class="site-header">
        <img class="logo-header" src="img/logo-amplia+.png" alt="Amplia +" />

        <nav class="nav-links-header">
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="login.html">Log-in</a>
            <a href="cadastro.html">Criar conta</a>

        </nav>

    </header>

    <main class="card-login">
        <h1>Log-in</h1>
 
        <form id="form-login">
            <div class="campo">
                <label for="email" class="visually-hidden">E-mail</label>
                <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required>
            </div>
 
            <div class="campo">
                <label for="senha" class="visually-hidden">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
            </div>
 
            <button id="entrar-btn" type="submit" class="btn-entrar">Entrar</button>
        </form>
 
        <p class="cadastro-link">Não possui conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
    </main>

    <script>
        // Esse script é da animação do botao do login junto do css -->
        const formulario = document.querySelector("#form-login");
        const botao = document.querySelector("#entrar-btn");

        formulario.addEventListener("submit", () => {
            botao.disabled = true;
            botao.textContent = "Entrando...";
        
        });
    </script>
 
</body>
 
</html>
