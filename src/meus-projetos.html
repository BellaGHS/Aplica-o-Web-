<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amplia + | Meus projetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/meus-projetos.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="logo" src="img/logo-amplia+.png" alt="Amplia +" />

            <nav class="main-menu" aria-label="Menu principal">
                <a href="inicio-hub.html" class="nav-item">
                    <i class="bi bi-house-door-fill"></i>
                    <span>Início</span>
                </a>
                <a href="conexoes.html" class="nav-item">
                    <i class="bi bi-globe2"></i>
                    <span>Conexões</span>
                </a>
                <a href="meus-projetos.html" class="nav-item active">
                    <i class="bi bi-list-ul"></i>
                    <span>Meus projetos</span>
                </a>
                <a href="mensagens.html" class="nav-item">
                    <i class="bi bi-chat-left-text-fill"></i>
                    <span>Mensagem</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="configuracoes.html" class="nav-item small-link">
                    <i class="bi bi-gear-fill"></i>
                    <span>Configurações</span>
                </a>
                <a href="index.html" class="nav-item small-link">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="conteudo">
            <header class="topbar" aria-label="Topo da página">
                <div class="topbar-spacer"></div>
                <div class="topbar-acoes">
                    <button class="icon-button" aria-label="Notificações">
                        <i class="bi bi-bell-fill"></i>
                    </button>
                    <button class="icon-button user-button" aria-label="Perfil do usuário">
                        <i class="bi bi-person-circle"></i>
                    </button>
                </div>
            </header>

            <section class="page-panel">
                <div class="page-header">
                    <h1>Meus projetos</h1>
                    <button class="btn-cadastrar" type="button">+ Cadastrar projeto</button>
                </div>

                <div class="tabs" aria-label="Filtros de projeto">
                    <button class="tab active" type="button">Todos <span>(0)</span></button>
                    <button class="tab" type="button">Em andamento <span>(0)</span></button>
                    <button class="tab" type="button">Concluído <span>(0)</span></button>
                    <button class="tab" type="button">Paralisado <span>(0)</span></button>
                </div>

                <div class="project-list empty-state" aria-live="polite">
                    <p>Sem projetos no momento</p>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
