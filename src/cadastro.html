<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Amplia +</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/cadastro.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="fundo">
    <section class="center">
    <header class="site-header">
        <img class="logo-header" src="img/logo-amplia+.png" alt="Amplia +" />

        <nav class="nav-links-header">
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="login.html">Log-in</a>
            <a href="cadastro.html">Criar conta</a>

        </nav>

    </header>

            <div class="fundo_branco">
                <h1>Crie sua conta</h1>
                <h2>Dados pessoais</h2>
                <div class="dados">
                    <div class="dados">
                        <div class="input-grupo">
                            <label for="nome">Nome completo</label>
                            <input id="nome" name="nome" type="text">
                        </div>

                        <div class="input-grupo">
                            <label for="email">E-mail</label>
                            <input id="email" name="email" type="email">
                        </div>

                        <div class="input-linha">
                            <div class="input-grupo">
                                <label for="cpf">CPF</label>
                                <input id="cpf" name="cpf" type="text">
                            </div>

                            <div class="input-grupo">
                                <label for="telefone">Telefone</label>
                                <input id="telefone" name="telefone" type="tel">
                            </div>
                        </div>

                        <div class="input-linha">
                            <div class="input-grupo">
                                <label for="senha">Senha</label>
                                <input id="senha" name="senha" type="password">
                            </div>

                            <div class="input-grupo">
                                <label for="confirmar-senha">Confirmar a senha</label>
                                <input id="confirmar-senha" name="confirmar-senha" type="password">
                            </div>
                        </div>
                    </div>
                        <!-- avisos sobre senha -->
                        <p>Para a sua segurança, sua senha deverá possuir no mínimo 8 caracteres, sendo:
                        </p>
                        <p>* Letras maíusculas e minúsculas</p>
                        <p>* Números</p>
                        <p>* Caracteres especiais</p>
                    </div>
                    <h2>Dados da Instituição</h2>
                    <div class="dados">
                            <div class="input-grupo">
                                <label for="cnpj">cnpj</label>
                                <input  id="cnpj" name="cnpj" type="text">
                            </div>
                            <div class="input-grupo">
                                <label for="razao_social">razao social da Instituição</label>
                                <input id="razao_social" name="razao_social" type="text">
                            </div>
                            <div class="termos">
                                <label>
                                    <input type="checkbox" id="termos" name="termos">
                                    Ao clicar você concorda com os nossos <a href="">termos de uso</a> <!--Aqui falta linkar os termos de uso <------------------------ -->
                                </label>
                            </div>
                            <button type="submit">Criar</button>
                        </div>
                        <p class="final">Já possui conta? <a href="login.html">Entre aqui</a></p>
                    </div>
    </div>

    </section>
</body>

</html>

</div>
