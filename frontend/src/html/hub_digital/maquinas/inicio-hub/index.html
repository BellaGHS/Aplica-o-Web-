<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Início</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/frontend/src/css/hub_css/inicio-hub.css">
    <link rel="stylesheet" href="/frontend/src/css/notificacao.css">

</head>

<body>
    <div class="layout">

        <!--menu lateral-->
        <aside class="sidebar">
            <img class="logo" src="/frontend/src/img/logo-amplia+.png" alt="Amplia +" />

            <nav>
                <a href="../inicio-hub/" class="ativo"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="../conexoes-maquina/"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="../minhas-maquinas/" id="menu-recursos"><i class="bi bi-printer-fill"></i>
                    <span>Minhas máquinas</span>
                </a>
                <a href="../menssagens/"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>

            <div class="rodape-menu">
                <a href="../configuracoes/"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="../../../site/index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <!-- conteúdo -->
        <main class="conteudo flex-grow-1">
            <div class="topbar">
                <label class="busca-topo">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Buscar por ...." aria-label="Buscar no site">
                </label>
                <div class="topbar-acoes">
                    <a href="#" aria-label="Notificações"><i class="bi bi-bell-fill"></i></a>
                    <a href="../perfil-maquina/" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>

            <div class="cabecalho">
                <h1>Encontre o projeto ideal</h1>
                <p>Conecte-se com pessoas, empresas e laboratórios que precisam do que você possui.</p>
            </div>

            <section class="painel">
                <div class="linha-busca">
                    <label class="campo-busca">
                        <i class="bi bi-search"></i>
                        <input id="filtro-texto" type="text" placeholder="O que você está procurando?">
                    </label>
                    <button class="btn-filtros" type="button">
                        <i class="bi bi-sliders"></i> Filtros
                    </button>
                </div>

            </section>
        </main>
    </div>

    <script>
        const campo = document.getElementById('filtro-texto');
        const contador = document.getElementById('contador');
        campo.addEventListener('input', () => {
            const termo = campo.value.toLowerCase();
            const cards = document.querySelectorAll('.card-projeto');
            let visiveis = 0;
            cards.forEach(card => {
                const mostrar = card.textContent.toLowerCase().includes(termo);
                card.style.display = mostrar ? '' : 'none';
                if (mostrar) visiveis++;
            });
            contador.textContent = `(${visiveis})`;
        });
    </script>
    <script src="../../../../../src/js/vlibras/vlibras.js"></script>
    <script src="/frontend/src/js/hub/menu-recursos.js"></script>
</body>
</html>
