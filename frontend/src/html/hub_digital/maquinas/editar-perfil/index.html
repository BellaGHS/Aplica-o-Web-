<!doctype html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Editar perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/frontend/src/css/hub_css/inicio-hub.css">
    <link rel="stylesheet" href="/frontend/src/css/hub_css/perfil-maquina.css">
</head>
 
<body class="pagina-perfil">
    <div class="layout">
 
        <aside class="sidebar">
            <img class="logo" src="/frontend/src/img/logo-amplia+.png" alt="Amplia +" />
 
            <nav>
                <a href="../inicio-hub/"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="../conexoes-maquina/"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="../minhas-maquinas/" id="menu-recursos"><i class="bi bi-printer-fill"></i>
                    <span>Minhas máquinas</span>
                </a>
                <a href="mensagens.html"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>
 
            <div class="rodape-menu">
                <a href="../configuracoes/"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="../../../site/index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <main class="conteudo">
 
            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="../perfil-maquina/" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>
 
            <!-- salvar só volta pro perfil -->
            <form id="form-editar-perfil">
 
                <section class="banner-perfil">
                    <div class="avatar-editavel">
                        <div class="avatar-grande">
                            <img id="preview-foto" src="" alt="Foto de perfil" hidden>
                            <i class="bi bi-person-fill" id="icone-foto"></i>
                        </div>
                        <label class="btn-camera" title="Alterar foto">
                            <i class="bi bi-camera-fill"></i>
                            <input type="file" id="fotoPerfil" name="foto" accept="image/*">
                        </label>
                    </div>
                    <div>
                        <h1></h1>
                        <span class="tipo"></span>
                        <p></p>
                    </div>
                </section>
 
                <!-- Informações  -->
                <section class="card-perfil">
                    <div class="cabecalho-card">
                        <h2><i class="bi bi-person"></i> Informações pessoais</h2>
                    </div>
 
                    <div class="grade-campos">
                        <div>
                            <label for="nomeExibicao">Nome de Exibição</label>
                            <input type="text" id="nomeExibicao" name="nomeExibicao">
                        </div>
                        <div>
                            <label for="nome">Nome completo</label>
                            <input type="text" id="nome" name="nome">
                        </div>
                        <div>
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div>
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone">
                        </div>
                        <div>
                            <label for="localizacao">Localização</label>
                            <input type="text" id="localizacao" name="localizacao">
                        </div>
                    </div>
 
                    <div class="acoes-edicao">
                        <button type="submit" class="btn-salvar">Salvar</button>
                    </div>
                </section>
 
                <section class="card-perfil">
                    <div class="cabecalho-card">
                        <h2><i class="bi bi-journal-text"></i> Sobre mim</h2>
                    </div>
                    <label for="sobre" class="visually-hidden">Sobre mim</label>
                    <textarea id="sobre" name="sobre" class="caixa-sobre"></textarea>
                </section>
 
            </form>

            <div class="modal fade" id="modalMensagem" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalTitulo">
                                Perfil atualizado!
                            </h5>
                        </div>

                        <div class="modal-body" id="modalTexto">
                            Suas informações foram salvas com sucesso.
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/frontend/src/js/hub/editar-perfil.js"></script>
</body>
 
</html>
