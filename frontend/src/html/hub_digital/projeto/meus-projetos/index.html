<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amplia + | Meus projetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/frontend/src/css/hub_css/meus-projetos.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <img class="logo" src="/frontend/src/img/logo-amplia+.png" alt="Amplia +" />

            <nav>
                <a href="/frontend/src/html/hub_digital/maquinas/inicio-hub"><i class="bi bi-house-door-fill"></i> Início</a>
                <a href="/frontend/src/html/hub_digital/maquinas/conexoes-maquina/"><i class="bi bi-globe2"></i> Conexões</a>
                <a href="/frontend/src/html/hub_digital/maquinas/minhas-maquinas/" id="menu-recursos"><i class="bi bi-printer-fill"></i>
                    <span>Minhas máquinas</span>
                </a>
                <a href="/frontend/src/html/hub_digital/maquinas/menssagens/"><i class="bi bi-chat-left-text-fill"></i> Mensagem</a>
            </nav>

            <div class="rodape-menu">
                <a href="/frontend/src/html/hub_digital/maquinas/configuracoes/"><i class="bi bi-gear-fill"></i> Configurações</a>
                <a href="../../../site/index.html"><i class="bi bi-box-arrow-left"></i> Sair</a>
            </div>
        </aside>

        <main class="conteudo">
            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="/frontend/src/html/hub_digital/maquinas/perfil-maquina/" aria-label="Meu perfil"><i class="bi bi-person-circle"></i></a>
                </div>
            </div>

            <section class="page-panel">
                <div class="page-header">
                    <h1>Meus projetos</h1>
                    <a href="../cadastrar-projeto/index.html">
                        <button class="btn-cadastrar" type="button">+ Cadastrar projeto</button>
                    </a>
                </div>

                <div class="tabs" aria-label="Filtros de projeto">
                    <button class="tab active" type="button">Todos <span>(0)</span></button>
                    <button class="tab" type="button">Em andamento <span>(0)</span></button>
                    <button class="tab" type="button">Concluído <span>(0)</span></button>
                    <button class="tab" type="button">Paralisado <span>(0)</span></button>
                </div>

                <div class="project-list empty-state" aria-live="polite">
                    <p>Sem projetos no momento</p>
                </div>
            </section>
        </main>
    </div>
    
     <!-- Aqui é o pop-up de desativar a maquina, que ta vinculado ja com o botao desativar -->
    <div id="fundo-modal" class="fundo-modal">
        <section class="conteudo-modal" role="dialog" aria-modal="true">
            <h2>Apagar projeto</h2>
            <p>Tem certeza que você quer apagar este projeto?</p>
            <p>Essa ação não poderá ser desfeita e todas as informações relacionadas ao projeto serão removidas.</p>
            <div class="modal-acoes">

                <button type="button" id="cancelar">Cancelar</button>
                <button type="button" id="confirmar">Apagar projeto</button>
            </div>
        </section>
    </div>

     <!-- Aqui é o javascript do pop-up, pra linkar tudo e fazer ele abrir qnd clicar -->
    <script>
        const fundo = document.getElementById("fundo-modal");

        document.getElementById("abrir-modal").addEventListener("click", () => {
            fundo.classList.add("aberto");
        });

        document.getElementById("cancelar").addEventListener("click", () => {
            fundo.classList.remove("aberto");
        });

        document.getElementById("confirmar").addEventListener("click", () => {
            // aqui é pra ligar pro botao realmente desativar, no beck-end
            fundo.classList.remove("aberto");
        });
    </script>
        <!-- O pop up ainda nao esta linkado pq nao tem botao de desativar na página  -->
    <script src="../../../../../src/js/vlibras/vlibras.js"></script>
    <script src="/frontend/src/js/hub/menu-recursos.js"></script>
</body>

</html>
