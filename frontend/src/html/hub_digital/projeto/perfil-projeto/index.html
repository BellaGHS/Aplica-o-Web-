
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Amplia + | Perfil do projeto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/frontend/src/css/hub_css/inicio-hub.css">
    <link rel="stylesheet" href="/frontend/src/css/hub_css/perfil-projeto.css">
</head>

<body class="pagina-perfil">

    <div class="layout">

        <aside class="sidebar">
            <img class="logo" src="/frontend/src/img/logo-amplia+.png" alt="Amplia +" />

            <nav>
                <a href="../inicio-hub/">
                    <i class="bi bi-house-door-fill"></i> Início
                </a>

                <a href="../conexoes-maquina/">
                    <i class="bi bi-globe2"></i> Conexões
                </a>

                <a href="../minhas-maquinas/" id="menu-recursos"><i class="bi bi-printer-fill"></i>
                    <span>Minhas máquinas</span>
                </a>

                <a href="../mensagens/">
                    <i class="bi bi-chat-left-text-fill"></i> Mensagem
                </a>
            </nav>

            <div class="rodape-menu">
                <a href="../configuracoes/">
                    <i class="bi bi-gear-fill"></i> Configurações
                </a>

                <a href="../../../site/index.html">
                    <i class="bi bi-box-arrow-left"></i> Sair
                </a>
            </div>
        </aside>

        <main class="conteudo">

            <div class="topbar">
                <div class="topbar-acoes">
                    <i class="bi bi-bell-fill" aria-label="Notificações"></i>
                    <a href="../perfil-maquina/" aria-label="Meu perfil">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </div>
            </div>

            <!-- Banner do projeto -->
            <section class="banner-projeto">

                <div class="imagem-projeto">
                    <img id="imagem-projeto" src="" alt="Imagem do projeto" hidden>
                    <i class="bi bi-image" id="icone-projeto"></i>
                </div>

                <h1 id="titulo-projeto"></h1>

            </section>

            <!-- Informações -->
            <section class="card-perfil">

                <div class="cabecalho-card">
                    <h2>Informações</h2>
                </div>

                <div class="informacoes-projeto">

                    <div class="campo-projeto quantidade">
                        <label>Quantidade de peças</label>
                        <p id="quantidade-pecas"></p>
                    </div>

                    <div class="campo-projeto localizacao">
                        <label>Localização</label>
                        <p id="localizacao"></p>
                    </div>

                    <div class="campo-projeto prazo">
                        <label>Prazo</label>
                        <p id="prazo"></p>
                    </div>

                    <div class="campo-projeto tipo-peca">
                        <label>Tipo de peça</label>
                        <p id="tipo-peca"></p>
                    </div>

                    <div class="campo-projeto dimensoes">
                        <label>Dimensões</label>

                        <div class="visual-dimensoes">
                            <img id="imagem-dimensoes"
                                src=""
                                alt="Dimensões do projeto"
                                hidden>
                            <span id="texto-dimensoes"></span>
                        </div>
                    </div>

                    <div class="campo-projeto materiais">
                        <label>Materiais</label>
                        <p id="materiais"></p>
                    </div>

                    <div class="campo-projeto arquivo-projeto">
                        <label>Arquivo</label>

                        <div class="arquivo-conteudo">
                            <i class="bi bi-file-earmark-text"></i>

                            <a id="link-arquivo" href="#" download>
                                <i class="bi bi-download"></i>
                                Baixar arquivo
                            </a>
                        </div>
                    </div>

                </div>
            </section>

            <!-- Descrição -->
            <section class="card-perfil card-descricao">

                <div class="cabecalho-card">
                    <h2>Descrição do projeto</h2>
                </div>

                <p class="texto-sobre" id="descricao-projeto"></p>

            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/src/js/hub/perfil-projeto.js"></script>
    <script src="/frontend/src/js/hub/menu-recursos.js"></script>
    <script src="/frontend/src/js/hub/menu-recursos.js"></script>

</body>
</html>
